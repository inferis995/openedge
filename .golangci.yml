version: "2"

run:
  timeout: 5m
  go: "1.22"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gocritic
    - gocyclo
    - dupl
    - misspell
    - noctx
    - bodyclose
    - nilerr
    - godot

  settings:
    gocyclo:
      min-complexity: 20
    dupl:
      threshold: 120
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - commentedOutCode
        - sloppyReassign
    govet:
      enable:
        - shadow
    misspell:
      locale: US
      # Words an Italian operator reads, which the US dictionary insists are
      # misspelled English. Every message this platform shows a plant electrician
      # is in Italian; the code and its comments are not. Without this the choice
      # is between contorting the wording of an alarm and muting the linter that
      # catches real typos in the English half.
      ignore-rules:
        - applicato
        - applicazione
        - automatica
        - automatico
        - cancellato
        - configurato
        - configurata
        - inventario
        - eliminato
        - momento
        - parita
        - rientrato
        - seriale

  exclusions:
    rules:
      # "Mosquitto" is an Eclipse project name, not a misspelling of "Mosquito"
      - linters: [misspell]
        text: "[Mm]osquitto"
      # Test files: allow more lenient rules
      - path: "_test\\.go"
        linters: [dupl, errcheck, bodyclose]
      # Generated files
      - path: "docs/"
        linters: [godot]
      # Migration files: skip all linters
      - path: "migrations/"
        linters:
          - errcheck
          - govet
          - staticcheck
          - ineffassign
          - unused
          - gocritic
          - gocyclo
          - dupl
          - misspell
          - noctx
          - bodyclose
          - nilerr
          - godot

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
