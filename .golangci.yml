version: "2"

run:
  timeout: 5m
  go: "1.22"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - gocritic
    - gocyclo
    - dupl
    - misspell
    - noctx
    - bodyclose
    - nilerr
    - godot

  settings:
    gocyclo:
      min-complexity: 20
    dupl:
      threshold: 120
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - commentedOutCode
        - sloppyReassign
    govet:
      enable:
        - shadow
    misspell:
      locale: US

  exclusions:
    rules:
      # "Mosquitto" is an Eclipse project name, not a misspelling of "Mosquito"
      - linters: [misspell]
        text: "[Mm]osquitto"
      # Test files: allow more lenient rules
      - path: "_test\\.go"
        linters: [dupl, errcheck, bodyclose]
      # Generated files
      - path: "docs/"
        linters: [godot]
      # Migration files: skip all linters
      - path: "migrations/"
        linters:
          - errcheck
          - govet
          - staticcheck
          - ineffassign
          - unused
          - gocritic
          - gocyclo
          - dupl
          - misspell
          - noctx
          - bodyclose
          - nilerr
          - godot

issues:
  max-issues-per-linter: 50
  max-same-issues: 10
