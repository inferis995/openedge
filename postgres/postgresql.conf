# Extensions
#
# REQUIRED. The compose file starts postgres with
#   command: postgres -c config_file=/etc/postgresql/postgresql.conf
# which REPLACES the timescale/timescaledb image's own configuration. Without
# this line the library is never preloaded, so the very first statement of
# migrations/20250308_schema.sql (CREATE EXTENSION timescaledb) kills the
# server mid-initialisation: the schema is never applied, and on the next start
# Postgres reports "directory appears to contain a database; skipping
# initialization" and comes up with NO TABLES AT ALL.
shared_preload_libraries = 'timescaledb'

# Connection
#
# REQUIRED for the same reason as shared_preload_libraries above: replacing the
# image's config file drops its settings, and PostgreSQL's OWN default for
# listen_addresses is 'localhost'. The server then binds inside its container
# only, and every other service gets "connection refused" on the compose
# network — the API never starts. The port itself is still not exposed to the
# host beyond what docker-compose publishes (127.0.0.1 by default).
listen_addresses = '*'

max_connections = 100
superuser_reserved_connections = 3

# Memory
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB

# WAL
wal_buffers = 16MB
checkpoint_completion_target = 0.9
wal_compression = on

# Query planner
default_statistics_target = 100
random_page_cost = 1.1
effective_io_concurrency = 200

# Autovacuum tuned for heavy INSERT historian tables
autovacuum = on
autovacuum_vacuum_scale_factor = 0.01
autovacuum_analyze_scale_factor = 0.005
autovacuum_vacuum_cost_delay = 2ms

# Logging
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on

# Timezone
timezone = 'UTC'
log_timezone = 'UTC'
