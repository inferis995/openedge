# OpenEdge MQTT Broker — authenticated, multi-tenant ACLs via Dynamic Security
#
# Bootstrap: on first start the entrypoint runs
#   mosquitto_ctrl dynsec init /mosquitto/config/dynamic-security.json $MQTT_ADMIN_USER $MQTT_ADMIN_PASSWORD
# which creates the admin account.  core-api connects as admin and provisions
# per-org users automatically when organizations are created.

# Each listener may have its own security settings (allow_anonymous differs
# between the internal MQTT port and the UI WebSocket port). Must appear before
# any other security setting.
per_listener_settings true

listener 1883
protocol mqtt
allow_anonymous false
# Dynamic Security plugin — per-client ACLs managed at runtime via MQTT commands.
# With per_listener_settings true the plugin must live INSIDE the listener
# block (same pattern as the entrypoint's bootstrap config), otherwise it is
# not attached to any listener and every authenticated client is rejected.
# The Alpine-based eclipse-mosquitto image ships the plugin in /usr/lib, not
# /usr/share. With the wrong path mosquitto logs "Unable to load plugin" and
# EXITS, so with `restart: always` the broker sat in a crash loop and every
# per-organization ACL this file configures was never enforced — the whole
# tenant isolation on the broker was inert.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

# WebSocket listener for the web UI (MQTT Monitor, realtime). The frontend
# connects anonymously through the nginx proxy (wss://<host>/mqtt), so this
# listener allows anonymous CONNECT and subscribe. Note: with
# per_listener_settings true the dynsec plugin above is attached to the 1883
# listener only, so this listener has NO per-topic ACLs — anyone who can reach
# wss://<host>/mqtt can read all topics. Acceptable for a single-tenant edge
# deployment; multi-tenant SaaS should authenticate the UI (pass username/
# password from the API settings to the mqtt client) and re-enable dynsec here.
listener 9001
protocol websockets
allow_anonymous true

# Persistence (QoS 1/2 queued messages survive restarts)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection limits
max_connections -1
max_keepalive 65535
message_size_limit 0
max_queued_messages 1000
