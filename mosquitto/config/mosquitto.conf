# Mosquitto Configuration for Industrial Edge Middleware

# Listener settings
listener 1883
protocol mqtt
allow_anonymous true

# WebSocket support
listener 9001
protocol websockets
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection settings
max_connections -1
max_keepalive 65535

# Message size
message_size_limit 0

# Queued messages
max_queued_messages 1000

# Memory limits
# set to 0 for unlimited (use with caution in production)
# memory_limit 0

# Per listener settings
listener 1883
protocol mqtt
allow_anonymous true

listener 9001
protocol websockets
allow_anonymous true
