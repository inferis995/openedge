# OpenEdge MQTT Broker — authenticated, multi-tenant ACLs via Dynamic Security
#
# Bootstrap: on first start the entrypoint runs
#   mosquitto_ctrl dynsec init /mosquitto/config/dynamic-security.json $MQTT_ADMIN_USER $MQTT_ADMIN_PASSWORD
# which creates the admin account.  core-api connects as admin and provisions
# per-org users automatically when organizations are created.

# NO per_listener_settings, and both listeners authenticated.
#
# There was a version of this file that set per_listener_settings true so the
# WebSocket listener could allow anonymous clients, because the web UI connected
# without credentials and was being refused. It worked, and it handed the broker
# to the internet: with per_listener_settings the dynsec plugin binds to the
# listener it is declared in, so 9001 ended up with no ACLs at all. nginx
# proxies /mqtt to 9001 and Traefik publishes nginx on 443, so anyone who could
# open the site could subscribe to # and read every tenant's live plant data —
# and publish cmd/write/{gateway}, which the drivers act on. That is a setpoint
# on somebody's machine, from a browser, with no account.
#
# The fix is not on this side. The UI now authenticates: core-api issues a
# per-organization, READ-ONLY identity (GET /api/mqtt/ui-credentials, role
# org-{id}-ui-role — see uiViewerACLs in internal/mqtt/dynsec.go), so this file
# can go back to one global security policy and mean it.
#
# Settings here are global: allow_anonymous applies to both listeners, and the
# plugin below is attached to both.
allow_anonymous false

listener 1883
protocol mqtt

# WebSocket listener for the web UI (MQTT Monitor, realtime dashboards), reached
# through the nginx proxy at wss://<host>/mqtt. Same authentication and the same
# per-tenant ACLs as 1883 — the UI simply signs in.
listener 9001
protocol websockets

# Dynamic Security plugin — per-client ACLs managed at runtime via MQTT commands.
# Declared once, outside any listener block, so it governs BOTH of them.
# The Alpine-based eclipse-mosquitto image ships the plugin in /usr/lib, not
# /usr/share. With the wrong path mosquitto logs "Unable to load plugin" and
# EXITS, so with `restart: always` the broker sat in a crash loop and every
# per-organization ACL this file configures was never enforced — the whole
# tenant isolation on the broker was inert.
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/config/dynamic-security.json

# Persistence (QoS 1/2 queued messages survive restarts)
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection limits
max_connections -1
max_keepalive 65535
message_size_limit 0
max_queued_messages 1000
