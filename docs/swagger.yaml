info:
  contact: {}
paths:
  /api/areas:
    get:
      consumes:
      - application/json
      description: Get a list of areas for the specified site
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: integer
      - description: Site ID
        in: query
        name: site_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handlers.Area'
            type: array
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Site not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List areas
      tags:
      - areas
    post:
      consumes:
      - application/json
      description: Create a new area for the specified site
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: integer
      - description: Area creation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.CreateAreaRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_handlers.Area'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Site not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a new area
      tags:
      - areas
  /api/areas/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an area by ID (cascades to gateways, tags)
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: integer
      - description: Area ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: Area deleted
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Area not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete an area
      tags:
      - areas
    get:
      consumes:
      - application/json
      description: Get a single area by ID
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: integer
      - description: Area ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.Area'
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Area not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get an area
      tags:
      - areas
    put:
      consumes:
      - application/json
      description: Update an area by ID
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: integer
      - description: Area ID
        in: path
        name: id
        required: true
        type: integer
      - description: Area update request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_handlers.UpdateAreaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handlers.Area'
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Area not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update an area
      tags:
      - areas
  /api/audit/actions:
    get:
      description: Get list of distinct audit action types
      responses:
        "200":
          description: OK
          schema:
            items:
              type: string
            type: array
      summary: Get available audit actions
      tags:
      - audit
  /api/audit/logs:
    get:
      consumes:
      - application/json
      description: Get audit logs with optional filters
      parameters:
      - description: Organization ID
        in: header
        name: X-Organization-ID
        required: true
        type: integer
      - description: Start time (ISO 8601)
        in: query
        name: start
        type: string
      - description: End time (ISO 8601)
        in: query
        name: end
        type: string
      - description: Filter by action type
        in: query
        name: action
        type: string
      - description: Filter by user ID
        in: query
        name: user_id
        type: integer
      - description: Filter by success status
        in: query
        name: success
        type: boolean
      - description: Limit results (default 100, max 500)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/internal_handlers.AuditLog'
            type: array
        "400":
          description: Invalid request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get audit logs
      tags:
      - audit
  /api/gateways:
    get:
