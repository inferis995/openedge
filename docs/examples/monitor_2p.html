<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="oe-props" content="pressione1, pressione2, batteria, ts">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:          #3e4d5e;
  --bar-bg:      #2c3848;
  --card-border: rgba(0,144,168,0.55);
  --card-hover:  rgba(0,160,190,0.85);
  --txt-1:       #08161f;
  --txt-2:       #1e5570;
  --val:         #061018;
}

html, body {
  width:100%; height:100%; overflow:hidden;
  background:var(--bg);
  font-family:'Segoe UI', Arial, sans-serif;
  color:var(--txt-1);
}

/* ══ TOPBAR ══════════════════════════════════════ */
#topbar {
  position:absolute; top:0; left:0; right:0; height:80px;
  background:var(--bar-bg);
  border-bottom:2px solid rgba(0,144,168,0.18);
  display:flex; align-items:center; padding:0 44px; gap:24px;
  z-index:200;
  box-shadow:0 2px 16px rgba(0,0,0,0.30);
}

#topbar-title {
  font-size:15px; font-weight:600; letter-spacing:3.5px;
  color:rgba(180,210,225,0.85); text-transform:uppercase;
  white-space:nowrap;
}

#title-flex-spacer { flex:1; }

/* ── BATTERY ──────────────────────────────────── */
#batt-widget {
  display:flex; align-items:center; gap:14px;
  padding:10px 20px; border-radius:10px;
  background:rgba(0,0,0,0.22);
  border:1px solid rgba(0,144,168,0.22);
}
#batt-icon {
  display:block; color:#00cc78;
  transition:color .4s;
  filter:drop-shadow(0 0 4px currentColor);
}
#batt-texts { display:flex; flex-direction:column; gap:2px; line-height:1; }
#batt-volt {
  font-family:'Consolas','Courier New',monospace;
  font-size:16px; font-weight:500;
  color:rgba(220,240,248,0.92); letter-spacing:1.5px;
}
#batt-pct {
  font-family:'Consolas','Courier New',monospace;
  font-size:11px; font-weight:600;
  letter-spacing:2.5px; text-transform:uppercase;
  transition:color .3s;
}
.batt-ok    { color:#00cc78; }
.batt-warn  { color:#f5a623; }
.batt-alarm { color:#e04040; }
@keyframes batt-blink { 0%,100%{opacity:1} 50%{opacity:.12} }
#batt-widget.blink { animation:batt-blink .65s ease-in-out infinite; }

/* ── TIMESTAMP ────────────────────────────────── */
#ts-display {
  display:flex; flex-direction:column; align-items:flex-end;
  gap:3px; line-height:1;
  padding:8px 16px; border-radius:10px;
  background:rgba(0,0,0,0.18);
  border:1px solid rgba(0,144,168,0.18);
}
#ts-label {
  font-family:'Consolas','Courier New',monospace;
  font-size:9px; font-weight:600; letter-spacing:2.5px;
  color:rgba(140,185,205,0.45); text-transform:uppercase;
}
#ts-date {
  font-family:'Consolas','Courier New',monospace;
  font-size:11px; letter-spacing:1.5px;
  color:rgba(140,185,205,0.62);
}
#ts-time {
  font-family:'Consolas','Courier New',monospace;
  font-size:17px; letter-spacing:1px;
  color:rgba(140,185,205,0.85);
}

#clock {
  font-family:'Consolas','Courier New',monospace;
  font-size:17px; color:rgba(140,185,205,0.80); letter-spacing:1px;
}

/* ══ STAGE ═══════════════════════════════════════ */
#stage {
  position:absolute; top:80px; left:0; right:0; bottom:72px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:80px;
}

/* ══ CARD ════════════════════════════════════════ */
.card {
  width:560px; height:440px;
  background:linear-gradient(175deg,#ffffff 0%,#eaf6fb 45%,#dff0f7 100%);
  border:1px solid var(--card-border); border-radius:20px;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:30px 40px 28px;
  box-shadow:
    0 8px 36px rgba(0,0,0,0.40),
    0 2px 6px rgba(0,0,0,0.18),
    inset 0 1px 0 rgba(255,255,255,0.90);
  transition:border-color .25s, box-shadow .25s;
  user-select:none;
  flex-shrink:0;
}
.card:hover {
  border-color:var(--card-hover);
  box-shadow:0 6px 28px rgba(0,144,168,0.20),0 2px 8px rgba(0,0,0,0.08);
}

.card-header {
  width:100%; display:flex; align-items:center; justify-content:center;
}
.card-tag {
  font-family:'Consolas','Courier New',monospace;
  font-size:12px; letter-spacing:3px;
  color:var(--txt-2); text-transform:uppercase;
}

.card-icon {
  display:flex; align-items:center; justify-content:center;
  width:100px; height:100px; border-radius:50%;
  background:rgba(0,144,168,.10); border:2px solid rgba(0,144,168,.35);
  box-shadow:0 0 20px rgba(0,144,168,.12);
}

.card-label {
  font-size:14px; font-weight:600; letter-spacing:3px;
  color:var(--txt-2); text-transform:uppercase; text-align:center;
}

.card-value-row { display:flex; align-items:baseline; gap:10px; }
.card-value {
  font-family:'Consolas','Courier New',monospace;
  font-size:88px; font-weight:400; color:var(--val); line-height:1;
  transition:color .3s;
}
.card-unit {
  font-size:24px; font-weight:400; color:var(--txt-2);
  letter-spacing:1px; align-self:flex-end; margin-bottom:12px;
}

/* ══ BOTTOMBAR ═══════════════════════════════════ */
#bottombar {
  position:absolute; bottom:0; left:0; right:0; height:72px;
  background:var(--bar-bg);
  border-top:1px solid rgba(0,0,0,0.08);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 -2px 12px rgba(0,0,0,0.25);
}
.sum-block {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-width:300px; padding:0 40px;
}
.sum-lbl {
  font-size:10px; font-weight:600; letter-spacing:2.5px;
  color:rgba(140,185,205,0.70); text-transform:uppercase;
}
.sum-val {
  font-family:'Consolas','Courier New',monospace;
  font-size:22px; color:rgba(220,240,248,0.92);
  margin-top:3px; font-weight:400;
}
.sum-sep {
  width:1px; height:36px;
  background:rgba(180,210,225,0.15);
}
</style>
</head>
<body>

<!-- ══ TOPBAR ══════════════════════════════════════ -->
<div id="topbar">
  <div id="topbar-title">MONITOR PRESSIONE</div>
  <div id="title-flex-spacer"></div>

  <div id="batt-widget">
    <svg id="batt-icon" width="64" height="28" viewBox="0 0 64 28">
      <rect x="1" y="2" width="54" height="24" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
      <rect x="55" y="9" width="7" height="10" rx="2" fill="currentColor" opacity=".55"/>
      <rect x="4"  y="5" width="10" height="18" rx="2" fill="rgba(255,255,255,0.07)"/>
      <rect x="16" y="5" width="10" height="18" rx="2" fill="rgba(255,255,255,0.07)"/>
      <rect x="28" y="5" width="10" height="18" rx="2" fill="rgba(255,255,255,0.07)"/>
      <rect x="40" y="5" width="10" height="18" rx="2" fill="rgba(255,255,255,0.07)"/>
      <rect id="batt-fill" x="4" y="5" width="48" height="18" rx="2" fill="#00cc78"/>
      <rect x="14" y="5" width="2" height="18" fill="rgba(44,56,72,0.70)"/>
      <rect x="26" y="5" width="2" height="18" fill="rgba(44,56,72,0.70)"/>
      <rect x="38" y="5" width="2" height="18" fill="rgba(44,56,72,0.70)"/>
    </svg>
    <div id="batt-texts">
      <span id="batt-volt">3.66 V</span>
      <span id="batt-pct" class="batt-ok">100%  ·  CARICA OK</span>
    </div>
  </div>

  <div id="ts-display">
    <span id="ts-label">TIMESTAMP</span>
    <span id="ts-date">--/--/----</span>
    <span id="ts-time">--:--:--</span>
  </div>

  <div id="clock">--:--:--</div>
</div>

<!-- ══ STAGE ════════════════════════════════════════ -->
<div id="stage">

  <!-- CARD P1 -->
  <div class="card" id="card-p1">
    <div class="card-header">
      <div class="card-tag">PT-101</div>
    </div>
    <div class="card-icon">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#00d4e8" stroke-width="1.4" opacity=".55"/>
        <circle cx="12" cy="12" r="5.5" stroke="#00d4e8" stroke-width=".9" opacity=".28"/>
        <line x1="12" y1="2.2" x2="12" y2="5"   stroke="#00d4e8" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
        <line x1="21.8" y1="12" x2="19" y2="12" stroke="#00d4e8" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
        <line x1="2.2"  y1="12" x2="5"  y2="12" stroke="#00d4e8" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
        <line x1="12" y1="12" x2="15.2" y2="7.4" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="1.6" fill="#00e5ff"/>
      </svg>
    </div>
    <div class="card-label">PRESSIONE MONTE</div>
    <div class="card-value-row">
      <span class="card-value" id="val-p1">0.00</span>
      <span class="card-unit">bar</span>
    </div>
  </div>

  <!-- CARD P2 -->
  <div class="card" id="card-p2">
    <div class="card-header">
      <div class="card-tag">PT-102</div>
    </div>
    <div class="card-icon">
      <svg width="60" height="60" viewBox="0 0 24 24" fill="none">
        <circle cx="12" cy="12" r="10" stroke="#00d4e8" stroke-width="1.4" opacity=".55"/>
        <circle cx="12" cy="12" r="5.5" stroke="#00d4e8" stroke-width=".9" opacity=".28"/>
        <line x1="12" y1="2.2" x2="12" y2="5"   stroke="#00d4e8" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
        <line x1="21.8" y1="12" x2="19" y2="12" stroke="#00d4e8" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
        <line x1="2.2"  y1="12" x2="5"  y2="12" stroke="#00d4e8" stroke-width="1.4" stroke-linecap="round" opacity=".5"/>
        <line x1="12" y1="12" x2="15.2" y2="7.4" stroke="#00e5ff" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="12" r="1.6" fill="#00e5ff"/>
      </svg>
    </div>
    <div class="card-label">PRESSIONE VALLE</div>
    <div class="card-value-row">
      <span class="card-value" id="val-p2">0.00</span>
      <span class="card-unit">bar</span>
    </div>
  </div>

</div><!-- /stage -->

<!-- ══ BOTTOMBAR ══════════════════════════════════ -->
<div id="bottombar">
  <div class="sum-block">
    <div class="sum-lbl">PRESSIONE MONTE</div>
    <div class="sum-val" id="sum-p1">0.00 bar</div>
  </div>
  <div class="sum-sep"></div>
  <div class="sum-block">
    <div class="sum-lbl">PRESSIONE VALLE</div>
    <div class="sum-val" id="sum-p2">0.00 bar</div>
  </div>
</div>

<script>
'use strict';
(function () {

  var S = { pressione1: 0, pressione2: 0, batteria: 3.66, ts: 0 };

  function init() {
    bindAVEVA();
    render();
    setInterval(clock, 1000);
    clock();
  }

  // ── toNum: parsing sicuro per valori numerici AVEVA ─────────────────────
  function toNum(v) {
    if (typeof v === 'number') return isNaN(v) ? 0 : v;
    var s = String(v).trim();
    if (/^\d{1,3}(\.\d{3})*(,\d*)?$/.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(',', '.');
    var n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  // ── tsToDisplay: converte Unix float (secondi) → data/ora ───────────────
  function tsToDisplay(ts) {
    if (!ts || ts <= 0) return { date: '--/--/----', time: '--:--:--' };
    var d    = new Date(ts * 1000);
    var date = zp(d.getDate()) + '/' + zp(d.getMonth() + 1) + '/' + d.getFullYear();
    var time = zp(d.getHours()) + ':' + zp(d.getMinutes()) + ':' + zp(d.getSeconds());
    return { date: date, time: time };
  }

  // ── AVEVA BINDING ────────────────────────────────────────────────────────
  function bindAVEVA() {
    if (typeof cwidget === 'undefined' || !cwidget) {
      setTimeout(bindAVEVA, 200);
      return;
    }
    ['pressione1', 'pressione2', 'batteria', 'ts'].forEach(function (p) {
      cwidget.on(p, function (n) { S[n] = toNum(cwidget[n]); render(); });
      if (cwidget[p] !== undefined && cwidget[p] !== null) S[p] = toNum(cwidget[p]);
    });
    render();
  }

  // ── Batteria ─────────────────────────────────────────────────────────────
  function battPct(v) {
    if (v >= 3.00) return 100;
    if (v >  2.10) return 50;
    if (v >  2.00) return 10;
    return 0;
  }
  function battColor(pct) {
    if (pct === 100) return '#00cc78';
    if (pct >=  50)  return '#f5a623';
    if (pct ===  10) return '#f5a623';
    return '#e04040';
  }
  function battLabel(pct) {
    if (pct === 100) return '100%  \u00B7  CARICA OK';
    if (pct ===  50) return ' 50%  \u00B7  MEDIA';
    if (pct ===  10) return ' 10%  \u00B7  BATTERIA QUASI SCARICA';
    return '  0%  \u00B7  BATTERIA SCARICA \u2014 ALLARME CRITICO';
  }

  // ── RENDER ───────────────────────────────────────────────────────────────
  function render() {
    var v1 = S.pressione1.toFixed(2); var v2 = S.pressione2.toFixed(2); tx('val-p2', v2); tx('sum-p2', v2 + ' bar');
    tx('val-p1', v1);
    tx('sum-p1', v1 + ' bar');

    var bv  = S.batteria;
    var pct = battPct(bv);
    var col = battColor(pct);
    var fill = id('batt-fill');
    if (fill) { fill.setAttribute('width', ((pct / 100) * 48).toFixed(1)); fill.setAttribute('fill', col); }
    var icon = id('batt-icon');
    if (icon) icon.style.color = col;
    tx('batt-volt', bv.toFixed(2) + ' V');
    var pctEl = id('batt-pct');
    if (pctEl) {
      pctEl.textContent = battLabel(pct);
      pctEl.className   = pct >= 100 ? 'batt-ok' : pct >= 50 ? 'batt-warn' : 'batt-alarm';
    }
    var widget = id('batt-widget');
    if (widget) widget.classList.toggle('blink', pct === 10);

    var tsd = tsToDisplay(S.ts);
    tx('ts-date', tsd.date);
    tx('ts-time', tsd.time);
  }

  // ── CLOCK ────────────────────────────────────────────────────────────────
  function clock() {
    var now = new Date();
    tx('clock', zp(now.getHours()) + ':' + zp(now.getMinutes()) + ':' + zp(now.getSeconds()));
  }

  // ── UTILS ─────────────────────────────────────────────────────────────────
  function id(x)    { return document.getElementById(x); }
  function tx(x, v) { var e = id(x); if (e) e.textContent = v; }
  function zp(n)    { return n < 10 ? '0' + n : '' + n; }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', init);
  else init();

})();

</script>
</body>
</html>
