# Cloud / SaaS deployment overlay.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.cloud.yml up -d
#   (or: make cloud-up)
#
# Requires in .env (copy .env.cloud.example → .env and fill in):
#   PUBLIC_HOST   your domain, e.g. app.openedge.io
#   ACME_EMAIL    email for Let's Encrypt notifications
#
# What this overlay does:
#   - Adds Traefik reverse proxy (HTTPS + MQTT/TLS via Let's Encrypt)
#   - Removes all host port bindings from internal services
#   - Only ports 80, 443, 8883 are exposed to the internet
#   - Adds HSTS, X-Frame-Options and other security headers

services:

  # ── Traefik v3 — reverse proxy + automatic TLS ──────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: openedge-traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=openedge-net
      # Entrypoints
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.mqtts.address=:8883
      # Redirect all HTTP → HTTPS permanently
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Let's Encrypt via TLS-ALPN-01 challenge (no port 80 open needed after initial)
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      # JSON access log (Loki / Datadog / CloudWatch compatible)
      - --accesslog=true
      - --accesslog.format=json
      # Structured log output
      - --log.format=json
      - --log.level=WARN
    ports:
      - "80:80"       # HTTP (redirects to HTTPS)
      - "443:443"     # HTTPS  (web UI + API)
      - "8883:8883"   # MQTT over TLS  (edge devices)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-letsencrypt:/letsencrypt
    restart: unless-stopped
    networks:
      - openedge-net

  # ── Web UI — served via Traefik; its built-in nginx proxies /api → core-api ─
  web-ui:
    ports: []   # Traefik handles external access
    labels:
      - "traefik.enable=true"
      # HTTPS route
      - "traefik.http.routers.web.rule=Host(`${PUBLIC_HOST}`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=80"
      # Security headers middleware
      - "traefik.http.middlewares.sec.headers.stsSeconds=63072000"
      - "traefik.http.middlewares.sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.sec.headers.stsPreload=true"
      - "traefik.http.middlewares.sec.headers.frameDeny=true"
      - "traefik.http.middlewares.sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.sec.headers.customResponseHeaders.X-Powered-By="
      - "traefik.http.routers.web.middlewares=sec"

  # ── Core API — internal only; web-ui nginx proxies /api/* to it ─────────────
  core-api:
    ports: []
    environment:
      ALLOWED_ORIGINS: "https://${PUBLIC_HOST}"

  # ── PostgreSQL — never exposed to internet ───────────────────────────────────
  postgres:
    ports: []

  # ── Redis — never exposed to internet ───────────────────────────────────────
  redis:
    ports: []

  # ── Mosquitto — MQTT/TLS via Traefik TCP proxy on port 8883 ─────────────────
  # Traefik terminates TLS (Let's Encrypt cert) and forwards plain MQTT to
  # mosquitto:1883 inside the Docker network.  No cert sharing required.
  mosquitto:
    ports: []   # Traefik handles 8883 externally
    environment:
      # Publish the public TLS endpoint to edge devices via the config API
      MQTT_PUBLIC_HOST: "${PUBLIC_HOST}"
      MQTT_PUBLIC_PORT: "8883"
    labels:
      - "traefik.enable=true"
      # TCP router for MQTT/TLS: Traefik terminates TLS, forwards plain TCP
      - "traefik.tcp.routers.mqtts.rule=HostSNI(`${PUBLIC_HOST}`)"
      - "traefik.tcp.routers.mqtts.entrypoints=mqtts"
      - "traefik.tcp.routers.mqtts.tls.certresolver=letsencrypt"
      - "traefik.tcp.services.mqtts.loadbalancer.server.port=1883"

  # ── Driver Manager — optional, profile: edge ────────────────────────────────
  # Use when the VPS also acts as the edge (no separate factory machines).
  # docker compose -f docker-compose.yml -f docker-compose.vps.yml --profile edge up -d
  # Or: make vps-up-edge
  driver-manager:
    profiles: ["edge"]
    build:
      context: .
      dockerfile: services/driver-manager/Dockerfile
    image: openedge-driver-manager:latest
    container_name: openedge-driver-manager
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-industrial_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: ${POSTGRES_DB:-industrial_edge}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASSWORD: ${MQTT_ADMIN_PASSWORD:-}
      CORE_API_URL: ${CORE_API_URL:-}
      CORE_API_TOKEN: ${CORE_API_TOKEN:-}
      ORG_ID: ${ORG_ID:-0}
      AGENT_VERSION: ${AGENT_VERSION:-v1.0.0}
      HEALTH_PORT: "8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - openedge-net

  # ── Monitoring — always on in VPS/cloud ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: openedge-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped
    networks:
      - openedge-net

  grafana:
    image: grafana/grafana:12.0.2
    container_name: openedge-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${PUBLIC_HOST}`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"
      - "traefik.http.routers.grafana.tls.certresolver=letsencrypt"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    restart: unless-stopped
    networks:
      - openedge-net

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: openedge-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    restart: unless-stopped
    networks:
      - openedge-net

  loki:
    image: grafana/loki:3.5.0
    container_name: openedge-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - openedge-net

  promtail:
    image: grafana/promtail:3.5.0
    container_name: openedge-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - openedge-net

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: openedge-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-industrial_user}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-industrial_edge}?sslmode=disable"
    restart: unless-stopped
    networks:
      - openedge-net

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: openedge-redis-exporter
    environment:
      REDIS_ADDR: redis:6379
    restart: unless-stopped
    networks:
      - openedge-net

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: openedge-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    restart: unless-stopped
    networks:
      - openedge-net

  mosquitto-exporter:
    image: sapcc/mosquitto-exporter:0.8.0
    container_name: openedge-mosquitto-exporter
    environment:
      BROKER_ENDPOINT: "tcp://mosquitto:1883"
      MQTT_USER: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASS: ${MQTT_ADMIN_PASSWORD:-}
    restart: unless-stopped
    networks:
      - openedge-net

volumes:
  traefik-letsencrypt:
  prometheus-data:
  grafana-data:
  alertmanager-data:
  loki-data:
