server {
    listen 80;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Custom 502/503/504 page with auto-refresh (shown while services are starting)
    error_page 502 503 504 @starting;
    location @starting {
        default_type text/html;
        return 502 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Starting...</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;display:flex;align-items:center;justify-content:center;min-height:100vh}.card{background:#fff;border-radius:12px;padding:40px 48px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center;max-width:380px}.spinner{width:44px;height:44px;border:4px solid #e5e7eb;border-top:4px solid #3b82f6;border-radius:50%;animation:spin .9s linear infinite;margin:0 auto 24px}@keyframes spin{to{transform:rotate(360deg)}}h1{color:#111827;font-size:20px;font-weight:600;margin-bottom:8px}p{color:#6b7280;font-size:14px;line-height:1.5;margin-bottom:6px}.badge{display:inline-block;background:#eff6ff;color:#3b82f6;font-size:12px;font-weight:500;padding:4px 12px;border-radius:20px;margin-top:20px}</style></head><body><div class="card"><div class="spinner"></div><h1>Services starting up</h1><p>The application backend is initializing.</p><p>This page will refresh automatically.</p><div class="badge">Retrying in 6 seconds...</div></div><script>setTimeout(function(){location.reload()},6000)</script></body></html>';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://core-api:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # WebSocket proxy (core-api realtime)
    location /api/ws/ {
        proxy_pass http://core-api:8081/api/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    # Explicitly serve the MQTT Monitor page (React App)
    location /mqtt-monitor {
        try_files $uri $uri/ /index.html;
    }

    # MQTT WebSocket proxy (Mosquitto broker for MQTT Monitor)
    location /mqtt {
        proxy_pass http://mosquitto:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
