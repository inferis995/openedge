global:
  resolve_timeout: 5m
  smtp_from: "${ALERTMANAGER_EMAIL_FROM:-alerts@openedge.local}"
  smtp_smarthost: "${ALERTMANAGER_SMTP_HOST:-localhost:587}"
  smtp_auth_username: "${ALERTMANAGER_SMTP_USER:-}"
  smtp_auth_password: "${ALERTMANAGER_SMTP_PASS:-}"
  smtp_require_tls: false

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 1h

receivers:
  - name: default
    email_configs:
      - to: "${ALERTMANAGER_EMAIL_TO:-admin@openedge.local}"
        send_resolved: true

  - name: critical
    email_configs:
      - to: "${ALERTMANAGER_EMAIL_TO:-admin@openedge.local}"
        send_resolved: true
    # Uncomment and configure for Slack:
    # slack_configs:
    #   - api_url: "${ALERTMANAGER_SLACK_WEBHOOK:-}"
    #     channel: "#openedge-alerts"
    #     send_resolved: true
    #     title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
    #     text: '{{ .CommonAnnotations.description }}'
    # Uncomment for PagerDuty:
    # pagerduty_configs:
    #   - routing_key: "${ALERTMANAGER_PAGERDUTY_KEY:-}"
    #     severity: critical

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
