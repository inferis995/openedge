groups:
  - name: openedge.critical
    rules:

      # API down
      - alert: CoreAPIDown
        expr: up{job="openedge-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenEdge API is down"
          description: "core-api has been unreachable for more than 1 minute."

      # API high latency
      - alert: APIHighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API p99 latency > 2s"
          description: "99th percentile response time is {{ $value | humanizeDuration }}."

      # DB connections
      - alert: DBConnectionsHigh
        expr: pg_stat_activity_count{datname="industrial_edge"} > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections high ({{ $value }})"
          description: "More than 20 active DB connections for 5 minutes."

      # DB down
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter is down"
          description: "Cannot reach postgres-exporter — DB may be down."

      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter unreachable for more than 1 minute."

      # Disk space
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 15% on /"
          description: "Only {{ $value | humanizePercentage }} disk space remaining."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk space CRITICAL — below 5%"
          description: "Only {{ $value | humanizePercentage }} disk remaining. Historian may stop writing."

      # Memory
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90%"
          description: "{{ $value | humanizePercentage }} of RAM in use."

      # MQTT broker
      - alert: MQTTBrokerDown
        expr: up{job="mosquitto"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MQTT broker (Mosquitto) is down"
          description: "No metrics from Mosquitto for 2 minutes — edge devices cannot send data."

      # Redis memory eviction (data loss risk)
      - alert: RedisEvictingKeys
        expr: rate(redis_evicted_keys_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis is evicting keys (>10/s)"
          description: "Redis is under memory pressure and evicting keys — tag shadow data may be lost."

      # ── The plant went quiet ────────────────────────────────────────────────
      #
      # Every rule above this point watches a PROCESS. None of them fires in the
      # failure that matters most here: core-api up, broker up, database up,
      # disk fine — and not one value arriving from the field. A driver
      # container in a crash loop, a plant network cut, a broker ACL that stops
      # matching after a rename all look exactly like a quiet Sunday.
      #
      # Gated on TagsTotal: a freshly installed system with nothing configured
      # yet is legitimately silent, and an alert that greets every new install
      # with a page is one that gets silenced before it is ever useful.
      # Judged gateway by gateway, by each one's own timeout. "No message for
      # 20 minutes" was the rule here: an outage on a PLC polled every second,
      # an ordinary afternoon for a data logger sending one frame every eight
      # hours — on such a site it paged almost all the time, and an alert that
      # always fires is one nobody reads. A gateway counts as offline when no
      # data arrived within its stale_after_minutes (the dashboard's own rule)
      # or its driver stopped sending heartbeats.
      - alert: AllGatewaysOffline
        expr: |
          openedge_gateways_offline >= openedge_gateways_enabled
          and on() openedge_gateways_enabled > 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Every gateway is offline"
          description: >-
            None of the {{ with query "openedge_gateways_enabled" }}{{ . | first | value }}{{ end }}
            enabled gateways is reporting within its timeout. Historian and alarms are blind:
            check the driver containers, the broker and the plant network.

      - alert: GatewaysOffline
        expr: openedge_gateways_offline > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} gateway(s) offline"
          description: "Some gateways sent no data within their own timeout, or their driver stopped. The Gateways page lists which."

      # ── Backups ─────────────────────────────────────────────────────────────
      # A backup that silently stopped is found on the day it is needed.
      - alert: BackupStale
        expr: |
          openedge_backup_last_timestamp_seconds > 0
          and (time() - openedge_backup_last_timestamp_seconds) > 36 * 3600
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "No new backup for over 36 hours"
          description: "The newest backup file is older than a day and a half: check the backup container and the disk."

      - alert: NoBackups
        expr: openedge_backup_last_timestamp_seconds == 0
        for: 26h
        labels:
          severity: warning
        annotations:
          summary: "No backup has ever been made"
          description: "A day after start there is still no backup file. Check BACKUP_SCHEDULE and the backup container."

      # core-api's own connection to the broker. Distinct from MQTTBrokerDown:
      # the broker can be perfectly healthy while this service is refused —
      # wrong credentials after a rotation, or an ACL that no longer matches.
      - alert: CoreAPIDisconnectedFromBroker
        expr: openedge_mqtt_connected == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "core-api is not connected to the MQTT broker"
          description: "The broker may be up while this service is refused — check credentials and ACLs."

      # Alarms that nobody clears. Not a fault in itself, but a queue that only
      # grows means the operators have stopped trusting the alarm list, which is
      # how a real alarm gets missed.
      - alert: ActiveAlarmsPileUp
        expr: openedge_active_alarms_total > 100
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} alarms active for over 30 minutes"
          description: "Unacknowledged alarms are accumulating — the alarm list may no longer be actionable."
