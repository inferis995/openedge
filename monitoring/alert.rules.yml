groups:
  - name: openedge.critical
    rules:

      # API down
      - alert: CoreAPIDown
        expr: up{job="openedge-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenEdge API is down"
          description: "core-api has been unreachable for more than 1 minute."

      # API high latency
      - alert: APIHighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 2
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "API p99 latency > 2s"
          description: "99th percentile response time is {{ $value | humanizeDuration }}."

      # DB connections
      - alert: DBConnectionsHigh
        expr: pg_stat_activity_count{datname="industrial_edge"} > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections high ({{ $value }})"
          description: "More than 20 active DB connections for 5 minutes."

      # DB down
      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL exporter is down"
          description: "Cannot reach postgres-exporter — DB may be down."

      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis exporter unreachable for more than 1 minute."

      # Disk space
      - alert: DiskSpaceLow
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space below 15% on /"
          description: "Only {{ $value | humanizePercentage }} disk space remaining."

      - alert: DiskSpaceCritical
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Disk space CRITICAL — below 5%"
          description: "Only {{ $value | humanizePercentage }} disk remaining. Historian may stop writing."

      # Memory
      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage above 90%"
          description: "{{ $value | humanizePercentage }} of RAM in use."

      # MQTT broker
      - alert: MQTTBrokerDown
        expr: up{job="mosquitto"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "MQTT broker (Mosquitto) is down"
          description: "No metrics from Mosquitto for 2 minutes — edge devices cannot send data."

      # Redis memory eviction (data loss risk)
      - alert: RedisEvictingKeys
        expr: rate(redis_evicted_keys_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis is evicting keys (>10/s)"
          description: "Redis is under memory pressure and evicting keys — tag shadow data may be lost."
