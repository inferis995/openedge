# OpenEdge — Self-Hosted / On-Prem
#
# USAGE:
#   make start          — build everything + start (HTTP on :3000)
#   make onprem-tls     — same + HTTPS on :443 with internal CA
#   make update         — pull latest + restart
#
# Cloud deployments:
#   Coolify → docker-compose.coolify.yml
#   VPS     → docker-compose.vps.yml
#
# Optional monitoring overlay:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile monitoring up -d
#
# Drivers (modbus/s7/opcua/mqtt/redis/lorawan) are built via profile "drivers"
# but NOT started automatically — driver-manager spawns them on demand via the
# Docker socket when you create a Gateway in the UI.

services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: openedge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrial_edge}
      POSTGRES_USER: ${POSTGRES_USER:-industrial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run 'make start'}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-industrial_user} -d ${POSTGRES_DB:-industrial_edge}"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  redis:
    image: redis:7-alpine
    container_name: openedge-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec",
              "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: openedge-mosquitto
    entrypoint: ["/mosquitto/config/docker-entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-core-api}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?MQTT_ADMIN_PASSWORD is required — run 'make start'}
    ports:
      - "18830:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1",
             "-i", "healthcheck", "-W", "3",
             "-u", "${MQTT_ADMIN_USER:-core-api}",
             "-P", "${MQTT_ADMIN_PASSWORD:-}"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  # ── Application ──────────────────────────────────────────────────────────────

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    image: openedge-core-api:latest
    container_name: openedge-core-api
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-industrial_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: ${POSTGRES_DB:-industrial_edge}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASSWORD: ${MQTT_ADMIN_PASSWORD:-}
      MQTT_PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-18830}
      PORT: ${PORT:-8081}
      BACKUP_PATH: /backups
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — run 'make start'}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backups:/backups
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  web-ui:
    build:
      context: .
      dockerfile: services/web-ui/Dockerfile
    image: openedge-web-ui:latest
    container_name: openedge-web-ui
    ports:
      - "${WEB_UI_PORT:-3000}:80"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  driver-manager:
    build:
      context: .
      dockerfile: services/driver-manager/Dockerfile
    image: openedge-driver-manager:latest
    container_name: openedge-driver-manager
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-industrial_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: ${POSTGRES_DB:-industrial_edge}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASSWORD: ${MQTT_ADMIN_PASSWORD:-}
      # Remote edge (cloud-hosted): set CORE_API_URL + CORE_API_TOKEN
      # Leave empty for on-prem (uses local DB directly)
      CORE_API_URL: ${CORE_API_URL:-}
      CORE_API_TOKEN: ${CORE_API_TOKEN:-}
      ORG_ID: ${ORG_ID:-0}
      AGENT_VERSION: ${AGENT_VERSION:-v1.0.0}
      HEALTH_PORT: "8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  engine-historian:
    build:
      context: .
      dockerfile: services/engine-historian/Dockerfile
    image: openedge-engine-historian:latest
    container_name: openedge-engine-historian
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-industrial_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: ${POSTGRES_DB:-industrial_edge}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: engine-historian
      MQTT_USERNAME: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASSWORD: ${MQTT_ADMIN_PASSWORD:-}
      SPARKPLUG_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  # ── TLS reverse proxy (profile: tls) ─────────────────────────────────────────
  # Enabled by: make onprem-tls
  # Caddy issues a cert from its own internal CA — no internet needed.
  # After first start: make export-root-ca → install on operator PCs once.
  caddy:
    profiles: ["tls"]
    image: caddy:2
    container_name: openedge-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-openedge.local}
    volumes:
      - ./caddy/Caddyfile.onprem:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web-ui:
        condition: service_healthy
    networks:
      - openedge-net

  # ── Drivers (profile: drivers — build-only, spawned by driver-manager) ───────
  # These images are built but never started directly.
  # driver-manager spawns them via Docker socket when you create a Gateway.
  driver-modbus:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-modbus/Dockerfile
    image: industrial-driver-modbus:latest
    networks:
      - openedge-net

  driver-s7:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-s7/Dockerfile
    image: industrial-driver-s7:latest
    networks:
      - openedge-net

  driver-opcua:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-opcua/Dockerfile
    image: industrial-driver-opcua:latest
    networks:
      - openedge-net

  driver-mqtt:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-mqtt/Dockerfile
    image: industrial-driver-mqtt:latest
    networks:
      - openedge-net

  driver-redis:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-redis/Dockerfile
    image: industrial-driver-redis:latest
    networks:
      - openedge-net

  driver-lorawan:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-lorawan/Dockerfile
    image: industrial-driver-lorawan:latest
    networks:
      - openedge-net

networks:
  openedge-net:
    driver: bridge
    name: openedge-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
