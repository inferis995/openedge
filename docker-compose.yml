# OpenEdge — Self-Hosted / On-Prem
#
# USAGE:
#   make start          — build everything + start (HTTP on :3000)
#   make onprem-tls     — same + HTTPS on :443 with internal CA
#   make update         — pull latest + restart
#
# Cloud deployments:
#   Coolify → docker-compose.coolify.yml
#   VPS     → docker-compose.vps.yml
#
# Optional monitoring overlay:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile monitoring up -d
#
# Drivers (modbus/s7/opcua/mqtt/redis/lorawan) are built via profile "drivers"
# but NOT started automatically — driver-manager spawns them on demand via the
# Docker socket when you create a Gateway in the UI.

services:

  # ── Infrastructure ───────────────────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb:latest-pg16
    mem_limit: ${POSTGRES_MEM_LIMIT:-4g}
    cpus: ${POSTGRES_CPUS:-4.0}
    pids_limit: 512
    container_name: openedge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-industrial_edge}
      POSTGRES_USER: ${POSTGRES_USER:-industrial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — run 'make start'}
    # Datastore — loopback only. Containers reach it as postgres:5432 over
    # openedge-net; publishing on 0.0.0.0 put the DB on the LAN/Internet.
    # Override with POSTGRES_BIND=0.0.0.0 only behind a firewall you control.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:5432:5432"
    security_opt:
      - no-new-privileges:true
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups:/backups
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-industrial_user} -d ${POSTGRES_DB:-industrial_edge}"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  redis:
    image: redis:7-alpine
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-1.0}
    pids_limit: 128
    container_name: openedge-redis
    # REDIS_PASSWORD is optional: when unset the ${VAR:+...} expansion collapses to
    # nothing and Redis starts exactly as before, so existing installs keep working.
    # $$ escapes compose interpolation so the expansion happens in the container.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command: ["sh", "-c", "exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy allkeys-lru $${REDIS_PASSWORD:+--requirepass \"$$REDIS_PASSWORD\"}"]
    # Datastore — loopback only (see postgres).
    ports:
      - "${REDIS_BIND:-127.0.0.1}:6379:6379"
    security_opt:
      - no-new-privileges:true
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning $${REDIS_PASSWORD:+-a \"$$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  mosquitto:
    image: eclipse-mosquitto:2
    mem_limit: ${MOSQUITTO_MEM_LIMIT:-256m}
    cpus: ${MOSQUITTO_CPUS:-1.0}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    container_name: openedge-mosquitto
    # The script lives at mosquitto/docker-entrypoint.sh, NOT inside
    # mosquitto/config — that directory is where the container writes
    # dynamic-security.json, so the bootstrap script is deliberately kept out
    # of it and mounted read-only at its own path. Pointing the entrypoint at
    # /mosquitto/config/docker-entrypoint.sh made the broker fail to start with
    # "no such file or directory", taking the whole stack down with it.
    entrypoint: ["/openedge-mosquitto-entrypoint.sh"]
    command: ["/usr/sbin/mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    environment:
      MQTT_ADMIN_USER: ${MQTT_ADMIN_USER:-core-api}
      MQTT_ADMIN_PASSWORD: ${MQTT_ADMIN_PASSWORD:?MQTT_ADMIN_PASSWORD is required — run 'make start'}
    ports:
      - "18830:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/docker-entrypoint.sh:/openedge-mosquitto-entrypoint.sh:ro
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      # An AUTHENTICATED probe, on purpose. A plain TCP check reported this
      # broker healthy while it was refusing every single client — the dynsec
      # config was unreadable, so mosquitto ran with an empty security config and
      # denied core-api, the historian and every driver. "The port is open" is
      # not the question worth asking of a broker whose entire job is
      # authorizing clients.
      #
      # Reading $$SYS/broker/version exercises connect, authenticate and
      # subscribe in one go; the entrypoint grants the platform role the
      # matching ACL. If that grant is ever lost, the container goes unhealthy
      # instead of quietly dropping all plant data.
      test: ["CMD-SHELL",
             "mosquitto_sub -t '$$SYS/broker/version' -C 1 -W 3 -u \"$$MQTT_ADMIN_USER\" -P \"$$MQTT_ADMIN_PASSWORD\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  # ── Application ──────────────────────────────────────────────────────────────

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    image: openedge-core-api:latest
    mem_limit: ${CORE_API_MEM_LIMIT:-1g}
    cpus: ${CORE_API_CPUS:-2.0}
    pids_limit: 512
    container_name: openedge-core-api
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-industrial_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: ${POSTGRES_DB:-industrial_edge}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASSWORD: ${MQTT_ADMIN_PASSWORD:-}
      # Encrypts MQTT/cloud credentials stored in global_settings. It was
      # generated into .env and documented, but never passed to the container,
      # so core-api always fell back to storing those secrets in cleartext.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Password for the bootstrap admin, applied only when the users table is
      # empty. Same defect as above: generated, documented and read by the code,
      # but never reaching the container — so every Docker deployment created
      # the account with the built-in default regardless of what .env said.
      OPENEDGE_INITIAL_ADMIN_PASSWORD: ${OPENEDGE_INITIAL_ADMIN_PASSWORD:-}
      MQTT_PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      MQTT_PUBLIC_PORT: ${MQTT_PUBLIC_PORT:-18830}
      PORT: ${PORT:-8081}
      BACKUP_PATH: /backups
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — run 'make start'}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backups:/backups
    # Browsers never talk to :8081 — web-ui's nginx proxies /api and /ws to
    # core-api:8081 over openedge-net, and Prometheus scrapes /metrics the same
    # way. Published on loopback only so the raw API (and /metrics) is reachable
    # for local curl/debug but not from the LAN. Set CORE_API_BIND=0.0.0.0 if you
    # deliberately want remote edges to hit the API without a reverse proxy.
    ports:
      - "${CORE_API_BIND:-127.0.0.1}:8081:8081"
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  web-ui:
    build:
      context: .
      dockerfile: services/web-ui/Dockerfile
    image: openedge-web-ui:latest
    mem_limit: ${WEB_UI_MEM_LIMIT:-128m}
    cpus: ${WEB_UI_CPUS:-0.5}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    container_name: openedge-web-ui
    ports:
      - "${WEB_UI_PORT:-3000}:80"
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  driver-manager:
    build:
      context: .
      dockerfile: services/driver-manager/Dockerfile
    image: openedge-driver-manager:latest
    mem_limit: ${DRIVER_MANAGER_MEM_LIMIT:-512m}
    cpus: ${DRIVER_MANAGER_CPUS:-1.0}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    container_name: openedge-driver-manager
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-industrial_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: ${POSTGRES_DB:-industrial_edge}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_USERNAME: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASSWORD: ${MQTT_ADMIN_PASSWORD:-}
      # Remote edge (cloud-hosted): set CORE_API_URL + CORE_API_TOKEN
      # Leave empty for on-prem (uses local DB directly)
      CORE_API_URL: ${CORE_API_URL:-}
      CORE_API_TOKEN: ${CORE_API_TOKEN:-}
      ORG_ID: ${ORG_ID:-0}
      AGENT_VERSION: ${AGENT_VERSION:-v1.0.0}
      HEALTH_PORT: "8081"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  engine-historian:
    build:
      context: .
      dockerfile: services/engine-historian/Dockerfile
    image: openedge-engine-historian:latest
    mem_limit: ${HISTORIAN_MEM_LIMIT:-512m}
    cpus: ${HISTORIAN_CPUS:-1.0}
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    container_name: openedge-engine-historian
    environment:
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${POSTGRES_USER:-industrial_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-}
      DB_NAME: ${POSTGRES_DB:-industrial_edge}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: engine-historian
      MQTT_USERNAME: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASSWORD: ${MQTT_ADMIN_PASSWORD:-}
      SPARKPLUG_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options: {max-size: "10m", max-file: "3"}
    networks:
      - openedge-net

  # ── TLS reverse proxy (profile: tls) ─────────────────────────────────────────
  # Enabled by: make onprem-tls
  # Caddy issues a cert from its own internal CA — no internet needed.
  # After first start: make export-root-ca → install on operator PCs once.
  caddy:
    profiles: ["tls"]
    image: caddy:2
    security_opt:
      - no-new-privileges:true
    container_name: openedge-caddy
    restart: unless-stopped
    ports:
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-openedge.local}
    volumes:
      - ./caddy/Caddyfile.onprem:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web-ui:
        condition: service_healthy
    networks:
      - openedge-net

  # ── Monitoring (profile: monitoring) ─────────────────────────────────────────
  # Enable with: make monitoring-up  (Grafana :3001, Prometheus :9090)
  # Always-on in cloud: included without profile in docker-compose.vps.yml

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v3.4.0
    security_opt:
      - no-new-privileges:true
    container_name: openedge-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    # Unauthenticated admin surface — loopback only. Grafana queries it as
    # prometheus:9090 over openedge-net.
    ports:
      - "${PROMETHEUS_BIND:-127.0.0.1}:9090:9090"
    restart: unless-stopped
    networks:
      - openedge-net

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:12.0.2
    security_opt:
      - no-new-privileges:true
    container_name: openedge-grafana
    environment:
      # On-prem/LAN default kept so `make monitoring-up` still works on existing
      # installs. SET GRAFANA_ADMIN_PASSWORD in .env — the internet-facing
      # docker-compose.vps.yml makes it mandatory rather than defaulted.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: "grafana-clock-panel"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # Bound to localhost like Prometheus and Alertmanager beside it. It was
      # the one monitoring service published on every interface, while carrying
      # an admin password that defaults to "admin" for on-prem installs — and
      # Grafana can query the datasource, so reaching it is reaching the
      # historian. Set GRAFANA_BIND=0.0.0.0 to expose it on a network you
      # control, and set GRAFANA_ADMIN_PASSWORD before you do.
      - "${GRAFANA_BIND:-127.0.0.1}:3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - openedge-net

  alertmanager:
    profiles: ["monitoring"]
    image: prom/alertmanager:v0.28.1
    security_opt:
      - no-new-privileges:true
    container_name: openedge-alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    # Unauthenticated admin surface — loopback only.
    ports:
      - "${ALERTMANAGER_BIND:-127.0.0.1}:9093:9093"
    restart: unless-stopped
    networks:
      - openedge-net

  loki:
    profiles: ["monitoring"]
    image: grafana/loki:3.5.0
    security_opt:
      - no-new-privileges:true
    container_name: openedge-loki
    command: -config.file=/etc/loki/local-config.yaml
    # Unauthenticated log store — loopback only. Grafana reads it as loki:3100.
    ports:
      - "${LOKI_BIND:-127.0.0.1}:3100:3100"
    volumes:
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - openedge-net

  promtail:
    profiles: ["monitoring"]
    image: grafana/promtail:3.5.0
    security_opt:
      - no-new-privileges:true
    container_name: openedge-promtail
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped
    networks:
      - openedge-net

  postgres-exporter:
    profiles: ["monitoring"]
    image: prometheuscommunity/postgres-exporter:v0.16.0
    security_opt:
      - no-new-privileges:true
    container_name: openedge-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-industrial_user}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-industrial_edge}?sslmode=disable"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - openedge-net

  redis-exporter:
    profiles: ["monitoring"]
    image: oliver006/redis_exporter:v1.67.0
    security_opt:
      - no-new-privileges:true
    container_name: openedge-redis-exporter
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - openedge-net

  node-exporter:
    profiles: ["monitoring"]
    image: prom/node-exporter:v1.9.1
    security_opt:
      - no-new-privileges:true
    container_name: openedge-node-exporter
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    pid: host
    restart: unless-stopped
    networks:
      - openedge-net

  mosquitto-exporter:
    profiles: ["monitoring"]
    image: sapcc/mosquitto-exporter:0.8.0
    security_opt:
      - no-new-privileges:true
    container_name: openedge-mosquitto-exporter
    environment:
      BROKER_ENDPOINT: "tcp://mosquitto:1883"
      MQTT_USER: ${MQTT_ADMIN_USER:-core-api}
      MQTT_PASS: ${MQTT_ADMIN_PASSWORD:-}
    depends_on:
      - mosquitto
    restart: unless-stopped
    networks:
      - openedge-net

  # ── Drivers (profile: drivers — build-only, spawned by driver-manager) ───────
  # These images are built but never started directly.
  # driver-manager spawns them via Docker socket when you create a Gateway.
  driver-modbus:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-modbus/Dockerfile
    image: industrial-driver-modbus:latest
    mem_limit: ${DRIVER_MEM_LIMIT:-256m}
    cpus: ${DRIVER_CPUS:-0.5}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - openedge-net

  driver-s7:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-s7/Dockerfile
    image: industrial-driver-s7:latest
    mem_limit: ${DRIVER_MEM_LIMIT:-256m}
    cpus: ${DRIVER_CPUS:-0.5}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - openedge-net

  driver-opcua:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-opcua/Dockerfile
    image: industrial-driver-opcua:latest
    mem_limit: ${DRIVER_MEM_LIMIT:-256m}
    cpus: ${DRIVER_CPUS:-0.5}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - openedge-net

  driver-mqtt:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-mqtt/Dockerfile
    image: industrial-driver-mqtt:latest
    mem_limit: ${DRIVER_MEM_LIMIT:-256m}
    cpus: ${DRIVER_CPUS:-0.5}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - openedge-net

  driver-redis:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-redis/Dockerfile
    image: industrial-driver-redis:latest
    mem_limit: ${DRIVER_MEM_LIMIT:-256m}
    cpus: ${DRIVER_CPUS:-0.5}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - openedge-net

  driver-lorawan:
    profiles: ["drivers"]
    build:
      context: .
      dockerfile: services/driver-lorawan/Dockerfile
    image: industrial-driver-lorawan:latest
    mem_limit: ${DRIVER_MEM_LIMIT:-256m}
    cpus: ${DRIVER_CPUS:-0.5}
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - openedge-net

networks:
  openedge-net:
    driver: bridge
    name: openedge-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  alertmanager-data:
    driver: local
  loki-data:
    driver: local
