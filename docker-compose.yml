version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: industrial-postgres
    environment:
      POSTGRES_DB: industrial_edge
      POSTGRES_USER: industrial_user
      POSTGRES_PASSWORD: industrial_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U industrial_user -d industrial_edge" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - industrial-network

  redis:
    image: redis/redis-stack:latest
    container_name: industrial-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - industrial-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: industrial-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: [ "CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-i", "healthcheck", "-W", "3" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - industrial-network

  influxdb:
    image: influxdb:2
    container_name: industrial-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: industrial_edge
      DOCKER_INFLUXDB_INIT_BUCKET: historical_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: [ "CMD", "influx", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - industrial-network

  core-api:
    build:
      context: .
      dockerfile: services/core-api/Dockerfile
    container_name: industrial-core-api
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: industrial_user
      DB_PASSWORD: industrial_pass
      DB_NAME: industrial_edge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/organizations" ]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - industrial-network

  web-ui:
    build:
      context: frontend
      dockerfile: Dockerfile
    container_name: industrial-web-ui
    ports:
      - "3004:80"
    depends_on:
      core-api:
        condition: service_healthy
    networks:
      - industrial-network

  driver-manager:
    build:
      context: .
      dockerfile: services/driver-manager/Dockerfile
    container_name: industrial-driver-manager
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: industrial_user
      DB_PASSWORD: industrial_pass
      DB_NAME: industrial_edge
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - industrial-network

  engine-historian:
    build:
      context: .
      dockerfile: services/engine-historian/Dockerfile
    container_name: industrial-engine-historian
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: industrial_user
      DB_PASSWORD: industrial_pass
      DB_NAME: industrial_edge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: engine-historian
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: my-super-secret-auth-token
      INFLUX_ORG: industrial_edge
      INFLUX_BUCKET: historical_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - industrial-network

  engine-alarm:
    build:
      context: .
      dockerfile: services/engine-alarm/Dockerfile
    container_name: industrial-engine-alarm
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: industrial_user
      DB_PASSWORD: industrial_pass
      DB_NAME: industrial_edge
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      MQTT_CLIENT_ID: engine-alarm
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - industrial-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  influxdb_data:
    driver: local
  influxdb_config:
    driver: local

networks:
  industrial-network:
    driver: bridge
