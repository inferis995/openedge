name: CI

on:
  push:
    branches: [main, master, develop, "claude/*"]
  pull_request:
    branches: [main, master, develop]

env:
  GO_VERSION: "1.25.12"  # must match the toolchain in go.mod: govulncheck reports against whatever runs
  NODE_VERSION: "20"
  JWT_SECRET: "ci-test-secret-key-minimum-32-chars-ok"

jobs:
  # ── Go: lint ────────────────────────────────────────────────────────────────
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Fetch master for diff baseline
        run: git fetch origin master --depth=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout=5m --new-from-rev=origin/master ./internal/...

  # ── Go: test ─────────────────────────────────────────────────────────────────
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Build everything, not just the packages under test: the services are
      # where most of the code lives, and a broken driver used to reach master
      # because CI only ever compiled ./internal/... transitively.
      - name: Build all packages
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./internal/... ./services/...

  # ── Go: known vulnerabilities ────────────────────────────────────────────────
  # Checks the dependency tree against the official Go vulnerability database.
  # This cannot be run from every development sandbox (some block vuln.go.dev),
  # so CI is the place that enforces it.
  go-vulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Gated by a script with an explicit, documented allowlist: a handful of
        # Moby DAEMON advisories have no fixed version in any release, and this
        # project only uses the client half. Every other finding still fails.
        run: ./scripts/govulncheck-gate.sh

  # ── Frontend: lint + type-check ──────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json

      - run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

  # ── Frontend: test ────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: services/web-ui/coverage/

  # ── End-to-end acceptance ────────────────────────────────────────────────────
  # Runs the ASSEMBLED stack and follows real paths across process boundaries.
  # This is the only job that can catch the failure mode that produced this
  # codebase's worst defects: two halves that are each individually correct and
  # simply not wired to each other (alarms were persisted, notifications were
  # implemented, and nothing published to the topic joining them).
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare environment
        run: |
          cp .env.example .env
          # Deterministic credentials for the run; nothing here is a real secret.
          {
            echo "JWT_SECRET=${{ env.JWT_SECRET }}"
            echo "OPENEDGE_INITIAL_ADMIN_PASSWORD=e2e-admin-password"
            echo "MQTT_ADMIN_USER=core-api"
            echo "MQTT_ADMIN_PASSWORD=e2e-mqtt-password"
            echo "ENCRYPTION_KEY=e2e-encryption-key-for-ci-32byte"
          } >> .env

      - name: Build images
        run: docker compose build

      - name: Start the stack
        # Split from the build, and report WHICH container is unhealthy on
        # failure: `docker compose up` waits on depends_on healthchecks and
        # exits with a message that does not say which probe failed, which
        # turns every startup problem into a guessing game.
        run: |
          set -o pipefail
          docker compose up -d 2>&1 | tee /tmp/compose-up.log || {
            echo "=== compose up failed — container states ==="
            docker compose ps -a
            echo "=== health probe output per container ==="
            for c in $(docker compose ps -aq); do
              name=$(docker inspect --format '{{.Name}}' "$c")
              health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
              echo "--- $name : $health"
              docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{.Output}}{{end}}{{end}}' "$c" | tail -5
            done
            exit 1
          }

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1; then
              echo "API is up after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "API never became ready"; exit 1

      - name: Run acceptance tests
        env:
          E2E_API_URL: http://127.0.0.1:8081
          E2E_MQTT_HOST: 127.0.0.1
          E2E_MQTT_PORT: "18830"
          E2E_ADMIN_PASSWORD: e2e-admin-password
          E2E_MQTT_USER: core-api
          E2E_MQTT_PASSWORD: e2e-mqtt-password
        run: go test -tags=e2e -v -timeout=10m ./test/e2e/...

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Docker: build (no push) ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build core-api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/core-api/Dockerfile
          push: false
          tags: openedge/core-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web-ui image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/web-ui/Dockerfile
          push: false
          tags: openedge/web-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
