name: CI

on:
  push:
    branches: [main, master, develop, "claude/*"]
  pull_request:
    branches: [main, master, develop]

env:
  GO_VERSION: "1.25.13"  # must match the toolchain in go.mod: govulncheck reports against whatever runs
  NODE_VERSION: "22"
  JWT_SECRET: "ci-test-secret-key-minimum-32-chars-ok"

jobs:
  # ── Go: lint ────────────────────────────────────────────────────────────────
  go-lint:
    name: Go Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Fetch master for diff baseline
        run: git fetch origin master --depth=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          # ./test/... too: those packages carry the deployment-configuration
          # and route-coverage checks, and lint that skips them lets style
          # drift into the files whose whole job is catching drift.
          args: --timeout=5m --new-from-rev=origin/master ./internal/... ./test/...

  # ── Go: test ─────────────────────────────────────────────────────────────────
  go-test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Build everything, not just the packages under test: the services are
      # where most of the code lives, and a broken driver used to reach master
      # because CI only ever compiled ./internal/... transitively.
      - name: Build all packages
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: Run tests with race detector
        # ./test/... carries the deployment-configuration checks. They need no
        # stack, so running them here rather than in the e2e job reports a
        # broken production template in seconds instead of ten minutes.
        run: go test -race ./internal/... ./services/... ./test/...

  # ── Go: known vulnerabilities ────────────────────────────────────────────────
  # Checks the dependency tree against the official Go vulnerability database.
  # This cannot be run from every development sandbox (some block vuln.go.dev),
  # so CI is the place that enforces it.
  go-vulncheck:
    name: Go Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        # Gated by a script with an explicit, documented allowlist: a handful of
        # Moby DAEMON advisories have no fixed version in any release, and this
        # project only uses the client half. Every other finding still fails.
        run: ./scripts/govulncheck-gate.sh

  # ── Frontend: lint + type-check ──────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json

      - run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      # Blocks a PR that pulls in a vulnerable package. The nightly Security
      # workflow runs the same gate against unchanged code, for advisories
      # published after the fact.
      - name: Dependency audit
        working-directory: .
        run: ./scripts/npm-audit-gate.sh

  # ── Frontend: test ────────────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json

      - run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: services/web-ui/coverage/

  # ── End-to-end acceptance ────────────────────────────────────────────────────
  # Runs the ASSEMBLED stack and follows real paths across process boundaries.
  # This is the only job that can catch the failure mode that produced this
  # codebase's worst defects: two halves that are each individually correct and
  # simply not wired to each other (alarms were persisted, notifications were
  # implemented, and nothing published to the topic joining them).
  e2e:
    name: End-to-End
    runs-on: ubuntu-latest
    needs: [go-test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare environment
        run: |
          cp .env.example .env
          # Deterministic credentials for the run; nothing here is a real secret.
          {
            echo "JWT_SECRET=${{ env.JWT_SECRET }}"
            echo "OPENEDGE_INITIAL_ADMIN_PASSWORD=e2e-admin-password"
            echo "MQTT_ADMIN_USER=core-api"
            echo "MQTT_ADMIN_PASSWORD=e2e-mqtt-password"
            echo "ENCRYPTION_KEY=e2e-encryption-key-for-ci-32byte"
          } >> .env

      - name: Build images
        run: docker compose build

      - name: Start the stack
        # Split from the build, and report WHICH container is unhealthy on
        # failure: `docker compose up` waits on depends_on healthchecks and
        # exits with a message that does not say which probe failed, which
        # turns every startup problem into a guessing game.
        run: |
          set -o pipefail
          docker compose up -d 2>&1 | tee /tmp/compose-up.log || {
            echo "=== compose up failed — container states ==="
            docker compose ps -a
            echo "=== health probe output per container ==="
            for c in $(docker compose ps -aq); do
              name=$(docker inspect --format '{{.Name}}' "$c")
              health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
              echo "--- $name : $health"
              docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{.Output}}{{end}}{{end}}' "$c" | tail -5
            done
            exit 1
          }

      - name: Every container must report healthy
        # web-ui reported "unhealthy" from the day the image was built: its probe
        # asked `localhost`, which resolves to ::1 ahead of 127.0.0.1, while that
        # nginx listens on IPv4 only. The site worked — the published port served
        # the whole acceptance suite — so nothing here ever looked, and the cost
        # landed on the deployments that have a proxy in front. Traefik skips
        # unhealthy containers, so the cloud stack answered 404 to everything,
        # and `make onprem-tls` never started Caddy, which waits for this
        # container to be healthy.
        #
        # A stack is not up because one port answers.
        run: |
          for _ in $(seq 1 24); do
            starting=$(docker compose ps -aq | xargs -r docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' | grep -c starting || true)
            if [ "$starting" = "0" ]; then break; fi
            sleep 5
          done
          bad=0
          for c in $(docker compose ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c")
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
            echo "$name: $health"
            if [ "$health" = "unhealthy" ] || [ "$health" = "starting" ]; then
              bad=1
              docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}exit={{.ExitCode}} {{.Output}}{{end}}{{end}}' "$c" | tail -3
            fi
          done
          exit $bad

      - name: Broker diagnostics
        # The broker refused EVERY client — core-api, engine-historian and
        # driver-manager all logged "not authorised" — while the TCP healthcheck
        # stayed green, so nothing upstream noticed. The startup lines that say
        # why scroll out of the 200-line failure dump, so print them here,
        # always, before anything can push them away.
        run: |
          echo "=== mosquitto startup ==="
          docker compose logs mosquitto | head -40
          echo "=== dynamic-security.json ==="
          docker compose exec -T mosquitto sh -c 'ls -l /mosquitto/config/ && id && \
            grep -o "\"username\"[^,]*" /mosquitto/config/dynamic-security.json' || \
            echo "(could not read the dynsec config — that alone would explain the denials)"
          echo "=== authenticated connect as the admin ==="
          # $SYS/broker/version is retained, so a working connect+subscribe
          # returns immediately. The earlier probe waited on 'diag/#', which
          # nobody publishes: it always timed out and printed a failure line in
          # runs that were entirely healthy — a diagnostic that cries wolf is
          # worse than none, because everyone learns to skip past it.
          docker compose exec -T mosquitto mosquitto_sub -t '$SYS/broker/version' -C 1 -W 3 \
            -u "$MQTT_ADMIN_USER" -P "$MQTT_ADMIN_PASSWORD" || echo "(admin connect/subscribe failed)"
        env:
          MQTT_ADMIN_USER: core-api
          MQTT_ADMIN_PASSWORD: e2e-mqtt-password

      - name: Wait for the API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8081/health >/dev/null 2>&1; then
              echo "API is up after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "API never became ready"; exit 1

      - name: Run acceptance tests
        env:
          E2E_API_URL: http://127.0.0.1:8081
          E2E_MQTT_HOST: 127.0.0.1
          E2E_MQTT_PORT: "18830"
          E2E_ADMIN_PASSWORD: e2e-admin-password
          E2E_MQTT_USER: core-api
          E2E_MQTT_PASSWORD: e2e-mqtt-password
          # The retention suite asserts TimescaleDB policies directly against
          # the database: whether the Go code calls add_retention_policy is
          # exactly what the never-executed SQL file also appeared to do, so
          # only the state in the database settles it. Postgres is published on
          # 127.0.0.1 by the default compose.
          E2E_DB_HOST: 127.0.0.1
          E2E_DB_PORT: "5432"
          E2E_DB_USER: industrial_user
          E2E_DB_NAME: industrial_edge
          E2E_DB_PASSWORD: CHANGE_ME_IN_PRODUCTION # from .env.example, copied in Prepare environment
        run: go test -tags=e2e -v -timeout=10m ./test/e2e/...

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── End-to-end against the CLOUD deployment ──────────────────────────────────
  # The job above proves the application. It proves it in the ON-PREM shape:
  # docker-compose.yml alone, every service published on the host, the API on
  # 8081 and the broker on 18830.
  #
  # docker-compose.vps.yml is a different deployment — Traefik in front, host
  # ports removed from everything else, the browser and every edge gateway
  # arriving through the proxy and the nginx behind it. It was written,
  # documented and recommended, and until this job nothing had ever brought it
  # up: not CI, not a test, not a person. That is the same gap that produced the
  # worst defects in this codebase — two halves that each look right, joined by
  # an assumption nobody executed.
  #
  # So the whole suite runs again, through the overlay, plus the assertions in
  # deployment_vps_test.go that only the overlay has: the redirect off port 80,
  # the security headers, the OAuth issuer, MQTT over TLS, and every internal
  # port being shut.
  #
  # What it does NOT prove: that Let's Encrypt issues a certificate. That needs
  # a public domain resolving here and a real CA. ACME_CA_SERVER is pointed at
  # an address nothing answers, so Traefik falls back to its own certificate and
  # the suite is told to accept it — everything up to TLS termination is real,
  # the certificate's provenance is not.
  e2e-vps:
    name: End-to-End (cloud overlay)
    runs-on: ubuntu-latest
    needs: [go-test]
    env:
      # RFC 2606 reserves .test: it can never resolve publicly, so a stray
      # request from this job cannot reach a real host.
      PUBLIC_HOST: openedge.ci.test
      # Both files, for every docker compose call in this job and for anything
      # the tests shell out to.
      COMPOSE_FILE: docker-compose.yml:docker-compose.vps.yml
      # Deterministic and worthless: this stack lives for one job on a runner
      # that is destroyed afterwards. They exist to satisfy preflight.sh, which
      # is the point — the production template has to pass its own gate.
      VPS_ADMIN_PASSWORD: vps-e2e-admin-password
      VPS_MQTT_PASSWORD: vps-e2e-mqtt-password
      VPS_DB_PASSWORD: vps-e2e-db-password
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve the public hostname to this runner
        # Traefik routes on Host() and on TLS SNI, so the suite has to arrive
        # under the name — connecting to 127.0.0.1 reaches no router at all.
        run: echo "127.0.0.1 $PUBLIC_HOST" | sudo tee -a /etc/hosts

      - name: Prepare a production .env
        # From .env.cloud.example, the file an operator is told to copy — so a
        # key added there and never filled in fails here rather than on a
        # customer's server.
        run: |
          set -eu
          cp .env.cloud.example .env
          set_env() { sed -i "s|^$1=.*|$1=$2|" .env; }
          set_env PUBLIC_HOST "$PUBLIC_HOST"
          set_env ACME_EMAIL "ci@$PUBLIC_HOST"
          # Nothing listens there: Traefik's ACME client fails immediately,
          # locally, and serves its default certificate. Without this the
          # overlay would hammer the real Let's Encrypt on every push and burn
          # the failed-validation rate limit for a domain that cannot resolve.
          set_env ACME_CA_SERVER "https://127.0.0.1:14000/directory"
          set_env POSTGRES_PASSWORD "$VPS_DB_PASSWORD"
          set_env MQTT_ADMIN_PASSWORD "$VPS_MQTT_PASSWORD"
          set_env JWT_SECRET "${{ env.JWT_SECRET }}"
          set_env ENCRYPTION_KEY "ci-vps-encryption-key-32bytes-ok"
          set_env OPENEDGE_INITIAL_ADMIN_PASSWORD "$VPS_ADMIN_PASSWORD"

      - name: Preflight
        # The gate `make vps-up` runs before it starts anything. Running it here
        # means the check that refuses a half-configured production start is
        # itself exercised — against the real template, on every push.
        run: bash scripts/preflight.sh .env

      - name: Build images
        run: docker compose build

      - name: Start the cloud stack
        run: |
          set -o pipefail
          docker compose up -d 2>&1 | tee /tmp/compose-vps-up.log || {
            echo "=== compose up failed — container states ==="
            docker compose ps -a
            for c in $(docker compose ps -aq); do
              name=$(docker inspect --format '{{.Name}}' "$c")
              health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
              echo "--- $name : $health"
              docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}{{.Output}}{{end}}{{end}}' "$c" | tail -5
            done
            exit 1
          }

      - name: Every container must report healthy
        # web-ui reported "unhealthy" from the day the image was built: its probe
        # asked `localhost`, which resolves to ::1 ahead of 127.0.0.1, while that
        # nginx listens on IPv4 only. The site worked — the published port served
        # the whole acceptance suite — so nothing here ever looked, and the cost
        # landed on the deployments that have a proxy in front. Traefik skips
        # unhealthy containers, so the cloud stack answered 404 to everything,
        # and `make onprem-tls` never started Caddy, which waits for this
        # container to be healthy.
        #
        # A stack is not up because one port answers.
        run: |
          for _ in $(seq 1 24); do
            starting=$(docker compose ps -aq | xargs -r docker inspect \
              --format '{{if .State.Health}}{{.State.Health.Status}}{{end}}' | grep -c starting || true)
            if [ "$starting" = "0" ]; then break; fi
            sleep 5
          done
          bad=0
          for c in $(docker compose ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$c")
            health=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
            echo "$name: $health"
            if [ "$health" = "unhealthy" ] || [ "$health" = "starting" ]; then
              bad=1
              docker inspect --format '{{if .State.Health}}{{range .State.Health.Log}}exit={{.ExitCode}} {{.Output}}{{end}}{{end}}' "$c" | tail -3
            fi
          done
          exit $bad

      - name: Wait for the proxy
        # Through Traefik and the web-ui nginx, not against core-api: if either
        # of those is misrouted the wait fails here, with the proxy's own logs
        # beside it, instead of as sixty test failures further down.
        run: |
          for i in $(seq 1 60); do
            if curl -fsSk "https://$PUBLIC_HOST/health" >/dev/null 2>&1; then
              echo "the stack answers through the proxy after ${i} attempts"; exit 0
            fi
            sleep 5
          done
          echo "=== nothing answered https://$PUBLIC_HOST/health ==="
          echo "--- what is running, and what it publishes ---"
          docker compose ps
          # Access logs are one line per probe and would bury the routing
          # errors that explain a 404; those are the lines worth reading.
          echo "--- traefik, minus its access log ---"
          docker compose logs traefik --tail=200 | grep -v '"ClientAddr"' | tail -60
          exit 1

      - name: Run acceptance tests through the proxy
        env:
          E2E_DEPLOYMENT: vps
          # Traefik cannot obtain a certificate here (see the job comment), so
          # it serves its own. Accepting it is what lets the suite reach the
          # application; the TLS termination itself is real.
          E2E_TLS_INSECURE: "1"
          E2E_API_URL: https://openedge.ci.test
          E2E_WEB_URL: https://openedge.ci.test
          E2E_MQTT_HOST: openedge.ci.test
          E2E_MQTT_PORT: "8883"
          E2E_MQTT_TLS: "1"
          E2E_ADMIN_PASSWORD: vps-e2e-admin-password
          E2E_MQTT_USER: core-api
          E2E_MQTT_PASSWORD: vps-e2e-mqtt-password
          # scripts/backup.sh reaches into the containers and then into Postgres
          # on the host, which this deployment does not publish. The direct job
          # runs it; here the closed port is the property being asserted.
          E2E_SKIP_DOCKER: "1"
        run: go test -tags=e2e -v -timeout=15m ./test/e2e/...

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v

  # ── Docker: build (no push) ──────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [go-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build core-api image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/core-api/Dockerfile
          push: false
          tags: openedge/core-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build web-ui image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/web-ui/Dockerfile
          push: false
          tags: openedge/web-ui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
