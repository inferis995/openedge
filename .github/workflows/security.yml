name: Security

# Why this exists separately from CI.
#
# CI answers "did this change introduce a vulnerability". That leaves the much
# more common case uncovered: the code did not change, and the world did. An
# advisory published this morning against a dependency frozen six months ago is
# invisible to every push-triggered check, because there is no push.
#
# So this runs on a clock. It is also the only place that looks at the
# CONTAINER layer — the Alpine userland the binaries actually run on, which no
# Go or npm manifest describes.
#
# A scheduled workflow that fails into an empty Actions tab is decoration, so a
# failure here opens a tracking issue.

on:
  schedule:
    # 05:30 UTC daily — before the Monday Dependabot batch, so a fresh advisory
    # is already filed when the update PRs land.
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    # Only when something that defines a dependency moves.
    paths:
      - "go.mod"
      - "go.sum"
      - "services/web-ui/package.json"
      - "services/web-ui/package-lock.json"
      - "services/*/Dockerfile"
      - "scripts/*-gate.sh"
      - ".github/workflows/security.yml"

permissions:
  contents: read

env:
  GO_VERSION: "1.25.13"
  NODE_VERSION: "22"

jobs:
  # ── Go dependencies and stdlib ──────────────────────────────────────────────
  go-vulnerabilities:
    name: Go Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: ./scripts/govulncheck-gate.sh

  # ── Frontend dependencies ───────────────────────────────────────────────────
  frontend-vulnerabilities:
    name: Frontend Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json

      - name: Install dependencies
        working-directory: services/web-ui
        run: npm ci

      - name: Audit
        run: ./scripts/npm-audit-gate.sh

  # ── Container base images ───────────────────────────────────────────────────
  #
  # The blind spot everything else shares: an OpenSSL or musl CVE in the runtime
  # layer is not in go.sum and not in package-lock.json, so a project can be
  # fully green on both and still ship a rotten userland.
  #
  # Builder and runtime stages are collected separately, because they carry
  # genuinely different risk and scanning them identically produces findings
  # nobody can act on.
  #
  # A runtime image IS the product: its userland runs on a customer's machine
  # and is reachable from the network. A builder image is discarded at the end
  # of the multi-stage build — nothing in it ships. The first scan of node:20
  # made the distinction concrete: it failed on six node-tar advisories inside
  # the npm that Node bundles, which never leave CI and which no tag can fix,
  # since every Node image carries whatever npm shipped with it. Left that way,
  # the job would have been permanently red for a reason nobody could resolve,
  # and a permanently red job is a muted one.
  #
  # So builders are scanned for their OS packages, where a fix means bumping the
  # tag, and not for the language tooling upstream pinned for us. The split is
  # derived from the Dockerfiles themselves — a stage with `AS <name>` is a
  # builder — so it cannot drift from what is actually built.
  collect-images:
    name: Collect Images
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.collect.outputs.services }}
      builder: ${{ steps.collect.outputs.builder }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect services to build, and builder bases to scan
        id: collect
        run: |
          # Services are derived from the Dockerfiles that exist, so a new one
          # is scanned the day it is added rather than the day somebody
          # remembers to list it here.
          services=$(ls -d services/*/Dockerfile | cut -d/ -f2 | sort -u | jq -R . | jq -sc .)

          strip() { sed -E 's/^FROM (--platform=[^ ]+ )?//; s/ +[Aa][Ss] .*//'; }
          builder=$(grep -rhE '^FROM .+ [Aa][Ss] ' services/*/Dockerfile \
            | strip | sort -u | jq -R . | jq -sc .)

          echo "services (built and scanned as shipped): $services"
          echo "builder bases (discarded after build): $builder"
          echo "services=$services" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"

  runtime-images:
    name: Runtime Image ${{ matrix.service }}
    needs: collect-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.collect-images.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      # Build it, then scan what was built.
      #
      # This used to scan the base image REF — `alpine:3.22` as it stands on the
      # registry right now. That is not the product. The runtime stages run
      # `apk upgrade`, so the image a customer receives can be clean while the
      # base tag it started from is not, and the old scan called that a failure
      # with no remedy: the fix it asked for, "bump the tag", does not exist
      # until somebody else rebuilds one. Scanning the built image asks the
      # question that matters — is what we ship clean — and makes the answer
      # something this repository can act on.
      - name: Build ${{ matrix.service }}
        run: |
          docker build -f services/${{ matrix.service }}/Dockerfile \
            -t openedge-scan/${{ matrix.service }}:ci .

      # Everything in the image — OS packages and bundled libraries alike. This
      # one ships, so all of it is customer-facing.
      #
      # ignore-unfixed is deliberate: a CVE with no released patch anywhere is
      # not something this repo can act on, and a permanently red job is one
      # everybody learns to ignore. Anything with a fix available is real and
      # fails the build.
      #
      # The action is pinned to a commit, not a tag. It had a supply-chain
      # incident, and a tag is a movable pointer: whoever controls that repo can
      # retarget v0.36.0 at new code, which then runs here with a token. A SHA
      # cannot be retargeted. Dependabot still offers upgrades and rewrites both
      # the SHA and the trailing comment.
      - name: Scan ${{ matrix.service }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: openedge-scan/${{ matrix.service }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  builder-images:
    name: Builder Image ${{ matrix.image }}
    needs: collect-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.collect-images.outputs.builder) }}
    steps:
      # A builder is DISCARDED at the end of the multi-stage build. Nothing in
      # it reaches a customer, and the only remedy for an OS CVE in one is
      # upstream rebuilding a tag this repository does not control — which is
      # precisely the "permanently red, nobody can act" state that mutes a job.
      # CVE-2026-14456 made that concrete: a HIGH openssl DoS sat in
      # golang:1.25-alpine and node:22-alpine for days with no newer tag to move
      # to, and it turned the whole nightly scan red every night.
      #
      # So the two questions are separated. What is in there is always PRINTED,
      # because a rotten build environment is worth knowing about. What STOPS
      # the build is CRITICAL only: at that severity the right move is to halt
      # and pin a digest by hand, even for an image that is thrown away.
      #
      # OS packages only — the language toolchain bundled in a builder is
      # whatever upstream shipped, is not separately patchable here, and is
      # discarded. (The input is vuln-type, not Trivy's own --pkg-types flag:
      # the action takes a fixed set of inputs and merely WARNS about unknown
      # ones, so pkg-types was accepted, silently dropped, and the scan ran
      # unrestricted.)
      - name: Report what is in ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Fail on CRITICAL in ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          vuln-type: os
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ── Make a scheduled failure visible ────────────────────────────────────────
  report:
    name: Report
    needs: [go-vulnerabilities, frontend-vulnerabilities, runtime-images, builder-images]
    # Only for the scheduled run: a push or a manual dispatch already has
    # somebody looking at the result.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled security scan is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const body = [
              'The nightly dependency scan failed. This is code that did not change —',
              'an advisory was published against it, or a base image tag went stale.',
              '',
              `Run: ${runUrl}`,
              '',
              'Which job failed tells you where to look:',
              '- **Go Dependencies** — `go get -u` the module, or add a documented',
              '  exception to `scripts/govulncheck-gate.sh`.',
              '- **Frontend Dependencies** — `npm audit fix` in `services/web-ui`.',
              '- **Runtime Image** — the image we ship has a fixable CVE. The runtime',
              '  stages run `apk upgrade`, so a rebuild usually clears it; if not, bump',
              '  the `FROM` tag in that service Dockerfile.',
              '- **Builder Image** — only CRITICAL stops the build here; nothing in a',
              '  builder ships. Pin a digest or bump the tag.',
              '',
              'Closing this without fixing it will simply reopen tomorrow.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-scan',
            });

            if (existing.data.length > 0) {
              // Comment rather than open a duplicate, so a scan that stays red
              // does not produce one issue per night.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-scan'],
              });
            }
