name: Security

# Why this exists separately from CI.
#
# CI answers "did this change introduce a vulnerability". That leaves the much
# more common case uncovered: the code did not change, and the world did. An
# advisory published this morning against a dependency frozen six months ago is
# invisible to every push-triggered check, because there is no push.
#
# So this runs on a clock. It is also the only place that looks at the
# CONTAINER layer — the Alpine userland the binaries actually run on, which no
# Go or npm manifest describes.
#
# A scheduled workflow that fails into an empty Actions tab is decoration, so a
# failure here opens a tracking issue.

on:
  schedule:
    # 05:30 UTC daily — before the Monday Dependabot batch, so a fresh advisory
    # is already filed when the update PRs land.
    - cron: "30 5 * * *"
  workflow_dispatch:
  push:
    branches: [main, master]
    # Only when something that defines a dependency moves.
    paths:
      - "go.mod"
      - "go.sum"
      - "services/web-ui/package.json"
      - "services/web-ui/package-lock.json"
      - "services/*/Dockerfile"
      - "scripts/*-gate.sh"
      - ".github/workflows/security.yml"

permissions:
  contents: read

env:
  GO_VERSION: "1.25.12"
  NODE_VERSION: "22"

jobs:
  # ── Go dependencies and stdlib ──────────────────────────────────────────────
  go-vulnerabilities:
    name: Go Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: ./scripts/govulncheck-gate.sh

  # ── Frontend dependencies ───────────────────────────────────────────────────
  frontend-vulnerabilities:
    name: Frontend Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/web-ui/package-lock.json

      - name: Install dependencies
        working-directory: services/web-ui
        run: npm ci

      - name: Audit
        run: ./scripts/npm-audit-gate.sh

  # ── Container base images ───────────────────────────────────────────────────
  #
  # The blind spot everything else shares: an OpenSSL or musl CVE in the runtime
  # layer is not in go.sum and not in package-lock.json, so a project can be
  # fully green on both and still ship a rotten userland.
  #
  # Builder and runtime stages are collected separately, because they carry
  # genuinely different risk and scanning them identically produces findings
  # nobody can act on.
  #
  # A runtime image IS the product: its userland runs on a customer's machine
  # and is reachable from the network. A builder image is discarded at the end
  # of the multi-stage build — nothing in it ships. The first scan of node:20
  # made the distinction concrete: it failed on six node-tar advisories inside
  # the npm that Node bundles, which never leave CI and which no tag can fix,
  # since every Node image carries whatever npm shipped with it. Left that way,
  # the job would have been permanently red for a reason nobody could resolve,
  # and a permanently red job is a muted one.
  #
  # So builders are scanned for their OS packages, where a fix means bumping the
  # tag, and not for the language tooling upstream pinned for us. The split is
  # derived from the Dockerfiles themselves — a stage with `AS <name>` is a
  # builder — so it cannot drift from what is actually built.
  collect-base-images:
    name: Collect Base Images
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.collect.outputs.runtime }}
      builder: ${{ steps.collect.outputs.builder }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect base images from Dockerfiles
        id: collect
        run: |
          strip() { sed -E 's/^FROM (--platform=[^ ]+ )?//; s/ +[Aa][Ss] .*//'; }

          builder=$(grep -rhE '^FROM .+ [Aa][Ss] ' services/*/Dockerfile \
            | strip | sort -u | jq -R . | jq -sc .)
          runtime=$(grep -rhE '^FROM ' services/*/Dockerfile \
            | grep -viE ' [Aa][Ss] ' | strip | sort -u | jq -R . | jq -sc .)

          echo "runtime (ships to customers): $runtime"
          echo "builder (discarded after build): $builder"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          echo "builder=$builder" >> "$GITHUB_OUTPUT"

  base-images:
    name: Runtime Image ${{ matrix.image }}
    needs: collect-base-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.collect-base-images.outputs.runtime) }}
    steps:
      # Everything in the image — OS packages and bundled libraries alike. This
      # one ships, so all of it is customer-facing.
      #
      # ignore-unfixed is deliberate: a distro CVE with no released patch is not
      # something this repo can act on, and a permanently red job is one
      # everybody learns to ignore. Anything with a fix available is a real,
      # actionable finding — bump the tag — and fails the build.
      #
      # The action is pinned to a commit, not a tag. It had a supply-chain
      # incident, and a tag is a movable pointer: whoever controls that repo can
      # retarget v0.36.0 at new code, which then runs here with a token. A SHA
      # cannot be retargeted. Dependabot still offers upgrades and rewrites both
      # the SHA and the trailing comment.
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  builder-images:
    name: Builder Image ${{ matrix.image }}
    needs: collect-base-images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.collect-base-images.outputs.builder) }}
    steps:
      # OS packages only — see the note on collect-base-images. The language
      # toolchain bundled in a builder is whatever upstream shipped, is not
      # separately patchable here, and is discarded before anything reaches a
      # customer. Its OS layer, which a tag bump does fix, still has to be clean.
      #
      # The input is vuln-type, not Trivy's own --pkg-types flag: the action
      # takes a fixed set of inputs and merely WARNS about unknown ones, so
      # pkg-types was accepted, silently dropped, and the scan ran unrestricted.
      # If this ever needs an option the action does not expose, run the Trivy
      # binary directly rather than passing a flag that quietly does nothing.
      - name: Scan ${{ matrix.image }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}
          scanners: vuln
          vuln-type: os
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  # ── Make a scheduled failure visible ────────────────────────────────────────
  report:
    name: Report
    needs: [go-vulnerabilities, frontend-vulnerabilities, base-images, builder-images]
    # Only for the scheduled run: a push or a manual dispatch already has
    # somebody looking at the result.
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Scheduled security scan is failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                           `/actions/runs/${context.runId}`;
            const body = [
              'The nightly dependency scan failed. This is code that did not change —',
              'an advisory was published against it, or a base image tag went stale.',
              '',
              `Run: ${runUrl}`,
              '',
              'Which job failed tells you where to look:',
              '- **Go Dependencies** — `go get -u` the module, or add a documented',
              '  exception to `scripts/govulncheck-gate.sh`.',
              '- **Frontend Dependencies** — `npm audit fix` in `services/web-ui`.',
              '- **Base Images** — bump the `FROM` tag; a patched one exists.',
              '',
              'Closing this without fixing it will simply reopen tomorrow.',
            ].join('\n');

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security-scan',
            });

            if (existing.data.length > 0) {
              // Comment rather than open a duplicate, so a scan that stays red
              // does not produce one issue per night.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body: `Still failing — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['security-scan'],
              });
            }
